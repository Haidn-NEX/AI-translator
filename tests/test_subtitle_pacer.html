<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Kiểm thử SubtitlePacer (Port từ overlay_ui.py)</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; }
    .preview { background: rgba(15, 18, 24, 0.85); border: 1px solid #334155; border-radius: 12px; padding: 16px; max-width: 820px; margin-bottom: 20px; text-align: center; }
    .hud { color: #94a3b8; font-size: 12px; margin-bottom: 6px; }
    .prev { color: rgba(254, 240, 138, 0.65); font-size: 17px; margin-bottom: 4px; }
    .src { color: #e2e8f0; font-size: 16px; margin-bottom: 6px; }
    .vi { color: #ffd54a; font-size: 26px; font-weight: bold; }
    pre { background: #1e293b; padding: 14px; border-radius: 8px; color: #4ade80; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>🧪 Kiểm thử Bộ điều nhịp đọc <code>subtitle_pacer.js</code></h1>
  <div class="preview">
    <div id="hud" class="hud">Sẵn sàng</div>
    <div id="prev" class="prev"></div>
    <div id="src" class="src"></div>
    <div id="vi" class="vi"></div>
  </div>
  <pre id="logOut">Đang chạy kiểm thử...</pre>

  <script type="module">
    import { SubtitlePacer } from "../chrome_extension/subtitle_pacer.js";

    const logLines = [];
    function assert(cond, msg) {
      if (!cond) {
        logLines.push(`❌ THẤT BẠI: ${msg}`);
        throw new Error(msg);
      }
      logLines.push(`✅ ĐẠT: ${msg}`);
    }

    // 1. Kiểm tra _format_prev_line
    assert(SubtitlePacer._format_prev_line("Xin chào") === "⤴ Xin chào", "_format_prev_line câu ngắn <= 135 ký tự");
    const longStr = "Đây là một câu tiếng Việt rất dài dùng để kiểm tra thuật toán cắt phần đuôi 128 ký tự và tìm khoảng trắng đầu tiên trong 25 ký tự đầu tiên của dòng lịch sử phụ đề.";
    const formattedLong = SubtitlePacer._format_prev_line(longStr);
    assert(formattedLong.startsWith("⤴ …") && formattedLong.length <= 135, "_format_prev_line câu dài > 135 ký tự");

    // 2. Kiểm tra _merge_text_cleanly
    const merged = SubtitlePacer._merge_text_cleanly(
      "Chúng ta đang tìm hiểu...",
      "...Về trí tuệ nhân tạo.",
      "...about artificial intelligence."
    );
    assert(merged === "Chúng ta đang tìm hiểu về trí tuệ nhân tạo.", `_merge_text_cleanly hạ chữ hoa đầu vế sau: "${merged}"`);

    // 3. Kiểm tra 4 nhánh điều nhịp với đồng hồ giả lập
    let fakeNow = 100.0;
    const renders = [];
    const pacer = new SubtitlePacer({
      nowFn: () => fakeNow,
      onRender: (state) => {
        renders.push({ ...state, t: fakeNow });
        document.getElementById("prev").textContent = state.prev;
        document.getElementById("src").textContent = state.src;
        document.getElementById("vi").textContent = state.vi;
      },
      onHud: (txt) => {
        document.getElementById("hud").textContent = txt;
      }
    });

    // Nhánh 1: Hiển thị ngay câu đầu tiên
    pacer.update_incoming_subtitle("We are building...", "Chúng tôi đang xây dựng...", 500, 400, "Ollama");
    assert(renders.length === 1 && renders[0].vi === "Chúng tôi đang xây dựng...", "Nhánh 1: Hiển thị ngay khi màn hình trống");

    // Nhánh 2: Merge tại chỗ khi câu trước còn bỏ lửng '...'
    fakeNow = 101.2;
    pacer.update_incoming_subtitle("...a local AI system.", "...Một hệ thống AI cục bộ.", 450, 380, "Ollama");
    assert(
      renders.length === 2 && renders[1].vi === "Chúng tôi đang xây dựng một hệ thống AI cục bộ.",
      `Nhánh 2: Gộp tại chỗ câu nối tiếp ngữ pháp ("${renders[1].vi}")`
    );

    // Nhánh 3: Xếp hàng đợi khi câu hiện tại chưa đủ dwell time, và tự cuộn ngay khi queue > 2
    fakeNow = 101.5;
    pacer.update_incoming_subtitle("This is the first complete queued sentence.", "Đây là câu xếp hàng thứ nhất hoàn chỉnh.", 400, 300, "Ollama");
    pacer.update_incoming_subtitle("This is the second complete queued sentence.", "Đây là câu xếp hàng thứ hai hoàn chỉnh.", 400, 300, "Ollama");
    assert(pacer._display_queue.length === 2, "Nhánh 3a: Giữ trong hàng đợi khi chưa đủ dwell time");

    pacer.update_incoming_subtitle("This is the third complete queued sentence.", "Đây là câu xếp hàng thứ ba hoàn chỉnh.", 400, 300, "Ollama");
    assert(
      renders[renders.length - 1].prev.includes("Chúng tôi đang xây dựng một hệ thống AI cục bộ."),
      "Nhánh 3b: Chống trễ khi queue > 2 -> tự động cuộn câu cũ lên dòng prev"
    );

    // Nhánh 4: Đủ thời gian đọc -> cuộn ngay
    pacer.reset_subtitles();
    fakeNow = 200.0;
    pacer.update_incoming_subtitle("Hello world.", "Xin chào thế giới.", 300, 200, "Ollama");
    fakeNow = 205.0;
    pacer.update_incoming_subtitle("Welcome to the conference.", "Chào mừng đến với hội thảo.", 300, 200, "Ollama");
    assert(
      renders[renders.length - 1].prev === "⤴ Xin chào thế giới." &&
      renders[renders.length - 1].vi === "Chào mừng đến với hội thảo.",
      "Nhánh 4: Đủ thời gian đọc -> cuộn câu cũ lên prev và hiện câu mới ngay"
    );

    document.getElementById("logOut").textContent = logLines.join("\n") + "\n\n🎉 TẤT CẢ KIỂM THỬ SUBTITLE_PACER ĐẠT 100%!";
  </script>
</body>
</html>
